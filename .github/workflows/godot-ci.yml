name: Godot CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2 headless
        uses: chickensoft-games/setup-godot@v2.4.3
        with:
          version: 4.7.2
          use-dotnet: false
      - name: Import project and validate scripts
        run: godot --headless --editor --path . --quit
      - name: Test gameplay loop headlessly
        run: timeout 20s godot --headless --path . -- --smoke-test
      - name: Run project smoke test
        run: timeout 20s godot --headless --path . --quit-after 5
